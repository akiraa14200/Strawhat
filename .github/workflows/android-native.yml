name: Build RykoCollection Native Android (Strawhat)

on:
  workflow_dispatch:
  push:
    branches: [integrated-native, firefox-site-launcher]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.13
          INSTALL_DIR="$RUNNER_TEMP/gradle"
          ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          mkdir -p "$INSTALL_DIR"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$ZIP"
          unzip -q "$ZIP" -d "$INSTALL_DIR"
          echo "$INSTALL_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --version
      - name: Run Ryko AI routing unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native-android :app:testDebugUnitTest --no-daemon
      - name: Assemble native debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native-android :app:assembleDebug --no-daemon
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: RykoCollection-Strawhat-firefox-sites-debug-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
