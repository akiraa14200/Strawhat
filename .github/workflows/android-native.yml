name: Build RykoCollection Native Android (Strawhat) - Firefox Sites compatibility

on:
  workflow_dispatch:
  push:
    branches: [integrated-native, firefox-site-launcher]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.13
          INSTALL_DIR="$RUNNER_TEMP/gradle"
          ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          mkdir -p "$INSTALL_DIR"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$ZIP"
          unzip -q "$ZIP" -d "$INSTALL_DIR"
          echo "$INSTALL_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --version
      - name: Run Ryko AI routing unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native-android :app:testDebugUnitTest --no-daemon
      - name: Assemble optimized release APK and Play Store bundle
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native-android :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Report optimized package sizes
        shell: bash
        run: |
          set -euo pipefail
          echo "Release APK outputs:"
          find native-android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0 | while IFS= read -r -d '' file; do
            du -h "$file"
          done
          echo "Play App Bundle:"
          find native-android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec du -h {} \;
          echo "Largest files inside ARM64 release APK:"
          APK="$(find native-android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -n "$APK" ]; then
            unzip -l "$APK" | sort -nr | head -n 25
          fi

      - name: Upload optimized release outputs
        uses: actions/upload-artifact@v4
        with:
          name: RykoCollection-Strawhat-optimized-release-test
          path: |
            native-android/app/build/outputs/apk/release/*.apk
            native-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native-android :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RykoCollection-Strawhat-debug-APK
          path: native-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
